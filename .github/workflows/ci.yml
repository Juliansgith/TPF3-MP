name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The three platforms players mix in one room.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  release-build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # What the release workflow packages, built as it builds it, so an
      # optimized or link-time problem shows before a release is tagged.
      - run: cargo build --release --locked -p tpf3mp-agent -p tpf3mp-server -p tpf3mp-hook
      - name: The binaries start
        shell: bash
        run: |
          ./target/release/tpf3mp-agent --version
          ./target/release/tpf3mp-server --version

  image:
    name: server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        run: docker buildx build --file deploy/Dockerfile --tag tpf3mp-server:ci --load .
      - name: The image starts and serves the admin endpoint
        run: |
          mkdir -p /tmp/tpf3mp && chmod 0777 /tmp/tpf3mp
          docker run -d --name tpf3mp --read-only --cap-drop ALL \
            -p 127.0.0.1:9470:9470 -v /tmp/tpf3mp:/data tpf3mp-server:ci \
            --listen 0.0.0.0:29470 --dev-self-signed /data/dev.der \
            --secret-file /data/invite.key --admin-listen 0.0.0.0:9470 \
            --tunnel-listen 0.0.0.0:29471 --tunnel-behind-proxy
          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:9470/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9470/metrics | grep tpf3mp_sessions
          curl -sf http://127.0.0.1:9470/metrics | grep tpf3mp_tunnels
          docker logs tpf3mp
          docker logs tpf3mp 2>&1 | grep "accepting tunnels"
