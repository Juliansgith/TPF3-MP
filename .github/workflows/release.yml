name: release

# Builds the player's package for every platform: the agent (with its
# launcher), the in-game hook library and the server. Runs by hand, which
# leaves the packages as workflow artifacts, or on a push to `main`, the
# release branch (see AGENTS.md), which also attaches them to a draft
# release of the workspace's version, to review before publishing.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cannot read the workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p tpf3mp-agent -p tpf3mp-server -p tpf3mp-hook
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # The server the launcher offers first, as host:port. Set the
          # repository variable TPF3MP_DEFAULT_SERVER to fill it in;
          # players can still type another or pass --server.
          DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
        run: |
          set -euo pipefail
          dir="tpf3mp-${VERSION}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp README.md LICENSE docs/PLAYING.md "$dir/"
          server=""
          if [ -n "$DEFAULT_SERVER" ]; then
            # A bracket expression: "]" first and "-" last are literal.
            if ! [[ "$DEFAULT_SERVER" =~ ^[]A-Za-z0-9.:[-]+$ ]]; then
              echo "::error::TPF3MP_DEFAULT_SERVER must be host:port, nothing else"
              exit 1
            fi
            server="--default-server $DEFAULT_SERVER "
          fi
          case "${{ matrix.name }}" in
            windows-*)
              cp target/release/tpf3mp-agent.exe target/release/tpf3mp-server.exe \
                 target/release/tpf3mp_hook.dll "$dir/"
              printf '@echo off\r\n"%%~dp0tpf3mp-agent.exe" launcher %s%%*\r\nif errorlevel 1 pause\r\n' \
                "$server" > "$dir/Launch TPF3-MP.cmd"
              7z a "$dir.zip" "$dir" > /dev/null
              echo "archive=$dir.zip" >> "$GITHUB_ENV"
              ;;
            linux-*)
              cp target/release/tpf3mp-agent target/release/tpf3mp-server \
                 target/release/libtpf3mp_hook.so "$dir/"
              printf '#!/bin/sh\nexec "$(dirname "$0")/tpf3mp-agent" launcher %s"$@"\n' "$server" \
                > "$dir/tpf3mp-launcher.sh"
              chmod +x "$dir/tpf3mp-launcher.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
            macos-*)
              cp target/release/tpf3mp-agent target/release/tpf3mp-server \
                 target/release/libtpf3mp_hook.dylib "$dir/"
              printf '#!/bin/sh\nexec "$(dirname "$0")/tpf3mp-agent" launcher %s"$@"\n' "$server" \
                > "$dir/tpf3mp-launcher.command"
              chmod +x "$dir/tpf3mp-launcher.command"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.archive }}
          if-no-files-found: error

  draft:
    name: draft release
    needs: [version, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A published version is final: releasing again needs a version
          # bump in Cargo.toml. A draft is refreshed with this commit.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; bump the version in Cargo.toml"
              exit 1
            fi
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              --target "$GITHUB_SHA" --title "TPF3-MP $TAG"
          fi
